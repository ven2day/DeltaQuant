schema_version: 1
market: FOREX
default_status: SHADOW
volume_semantics: oanda_tick_count
# 5m grains power the additive SCALP horizon (see forex_scalp_* settings). They
# are registered SHADOW like every other grain and only become PAPER-executable
# after scripts/validate_forex_strategies.py grants OOS eligibility on 5m.
strategies:
  ema_adx_trend: {enabled: true, timeframes: [5m, 15m, 30m, 1h, 4h], ml_policy: ML_OPTIONAL}
  donchian_breakout: {enabled: true, timeframes: [5m, 15m, 30m, 1h, 4h], ml_policy: ML_OPTIONAL}
  time_series_momentum: {enabled: true, timeframes: [1h, 4h], ml_policy: ML_OPTIONAL}
  trend_pullback: {enabled: true, timeframes: [15m, 30m, 1h, 4h], ml_policy: ML_OPTIONAL}
  supertrend_adx_ema: {enabled: true, timeframes: [5m, 15m, 30m, 1h, 4h], ml_policy: ML_OPTIONAL}
  macd_trend_continuation: {enabled: true, timeframes: [5m, 30m, 1h, 4h], ml_policy: ML_OPTIONAL}
  bollinger_rsi_mean_reversion: {enabled: true, timeframes: [5m, 15m, 30m, 1h], ml_policy: ML_OPTIONAL}
  vwap_mean_reversion: {enabled: false, reason: no_centralized_exchange_volume, ml_policy: ML_DISABLED}
  opening_range_breakout: {enabled: false, reason: forex_session_validation_required, ml_policy: ML_DISABLED}
  relative_strength_momentum: {enabled: false, reason: currency_strength_model_required, ml_policy: ML_DISABLED}
