services:
  deltaquant-postgres:
    image: postgres:16-alpine
    container_name: deltaquant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required -- scripts/start_all.sh derives it from env/.env.common's DATABASE_URL automatically; if running docker compose directly, export it yourself}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deltaquant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

  market-history-db:
    image: timescale/timescaledb:latest-pg16
    container_name: deltaquant-market-history
    restart: unless-stopped
    environment:
      POSTGRES_DB: deltaquant_history
      POSTGRES_USER: deltaquant
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-deltaquant_local_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - deltaquant-timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltaquant -d deltaquant_history"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  deltaquant-postgres-data:
  deltaquant-timescale-data:
